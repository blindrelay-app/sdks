[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blindrelay"
version = "0.1.0"
description = "Official Python SDK for the Blindrelay transactional email API."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]

[project.urls]
Homepage = "https://blindrelay.app"
Repository = "https://github.com/blindrelay-app/sdks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blindrelay = ["py.typed"]
