[package]
name = "blindrelay"
version = "0.1.0"
edition = "2021"
description = "Official Rust SDK for the Blindrelay transactional email API."
license = "MIT"
repository = "https://github.com/blindrelay-app/sdks"
publish = false

# Standalone: the repository root is a separate Cargo workspace.
[workspace]

[dependencies]
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
